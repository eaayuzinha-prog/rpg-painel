<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARQUIVO DE PERSONAGENS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(circle at center, #202020 0%, #0b0b0b 55%, #050505 100%);

            color: #e5e5e5;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }

        .container {

            width: 100%;

            max-width: 850px;

            border: 1px solid #333;

            background: rgba(10, 10, 10, 0.94);

            padding: 45px;

            box-shadow:
                0 0 30px rgba(0, 0, 0, 0.8),
                inset 0 0 40px rgba(255, 255, 255, 0.02);

        }

        .top {

            text-align: center;

            border-bottom: 1px solid #333;

            padding-bottom: 25px;

            margin-bottom: 35px;

        }

        .top small {

            display: block;

            color: #777;

            font-size: 11px;

            letter-spacing: 4px;

            margin-bottom: 12px;

        }

        h1 {

            margin: 0;

            font-size: 32px;

            letter-spacing: 5px;

            font-weight: 600;

        }

        .subtitle {

            margin-top: 12px;

            color: #666;

            font-size: 12px;

            letter-spacing: 2px;

        }

        .records {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 15px;

        }

        .record {

            text-decoration: none;

            color: #ddd;

            border: 1px solid #333;

            background: #101010;

            padding: 25px 15px;

            text-align: center;

            transition: 0.2s;

        }

        .record:hover {

            border-color: #777;

            background: #171717;

            transform: translateY(-3px);

        }

        .number {

            display: block;

            font-size: 11px;

            color: #666;

            letter-spacing: 3px;

            margin-bottom: 12px;

        }

        .person {

            display: block;

            font-size: 18px;

            letter-spacing: 2px;

        }

        .status {

            display: block;

            margin-top: 10px;

            font-size: 10px;

            color: #555;

            letter-spacing: 1px;

        }

        .master {

            margin-top: 35px;

            padding-top: 25px;

            border-top: 1px solid #333;

            text-align: center;

        }

        .master a {

            display: inline-block;

            padding: 13px 28px;

            border: 1px solid #444;

            color: #888;

            text-decoration: none;

            font-size: 11px;

            letter-spacing: 3px;

            transition: 0.2s;

        }

        .master a:hover {

            color: #ddd;

            border-color: #777;

        }

        .footer {

            text-align: center;

            margin-top: 35px;

            color: #444;

            font-size: 9px;

            letter-spacing: 2px;

        }

        @media (max-width: 650px) {

            .container {
                padding: 30px 20px;
            }

            .records {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="top">

            <small>REGISTRO DIGITAL // ACESSO RESTRITO</small>

            <h1>ARQUIVO DE PERSONAGENS</h1>

            <div class="subtitle">
                SELECIONE O REGISTRO CORRESPONDENTE
            </div>

        </div>


        <div class="records">

            <a class="record" href="personagem1.html">

                <span class="number">REGISTRO 01</span>

                <span class="person">
                    PERSONAGEM 01
                </span>

                <span class="status">
                    ACESSAR FICHA
                </span>

            </a>


            <a class="record" href="personagem2.html">

                <span class="number">REGISTRO 02</span>

                <span class="person">
                    PERSONAGEM 02
                </span>

                <span class="status">
                    ACESSAR FICHA
                </span>

            </a>


            <a class="record" href="personagem3.html">

                <span class="number">REGISTRO 03</span>

                <span class="person">
                    PERSONAGEM 03
                </span>

                <span class="status">
                    ACESSAR FICHA
                </span>

            </a>

        </div>


        <div class="master">

            <a href="gm.html">
                🔒 ACESSO DO MESTRE
            </a>

        </div>


        <div class="footer">

            ARQUIVO CONFIDENCIAL // SISTEMA DE REGISTRO

        </div>

    </div>

</body>

</html>
